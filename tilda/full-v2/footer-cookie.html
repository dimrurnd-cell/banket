<!-- Банкет-Холл: уведомление об использовании cookie. Метрика работает сразу, баннер только сообщает об этом. -->
<style>
.ckb{position:fixed;left:24px;bottom:24px;z-index:9995;width:400px;max-width:calc(100vw - 24px);box-sizing:border-box;
  padding:18px 20px;background:#fffdf9;color:#2a2926;border:1px solid #d8d1c5;border-radius:16px;
  box-shadow:0 18px 50px rgba(42,41,38,.22);font-family:Jost,Arial,sans-serif;font-size:13.5px;line-height:1.45}
.ckb[hidden]{display:none}
.ckb__title{margin:0 0 4px;font-size:16px;font-weight:500}
.ckb__text{margin:0 0 14px;color:#666159}
.ckb__text a{color:#a7432c!important;text-decoration:underline!important;text-underline-offset:2px}
.ckb__btn{min-height:40px;padding:0 22px;border-radius:8px;border:1px solid #a7432c;background:#a7432c;color:#fffdf9;
  font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.ckb__btn:hover{background:#8e3824}
.ckb__btn:focus-visible{outline:2px solid #2a2926;outline-offset:2px}
@media (max-width:640px){
  .ckb{left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom));padding:14px 16px;font-size:13px}
  .ckb__title{font-size:15px}
  .ckb__text{margin-bottom:10px}
  .ckb__btn{width:100%}
}
</style>

<div class="ckb" id="ckb" role="region" aria-label="Уведомление о cookie" hidden>
  <p class="ckb__title">Мы используем cookie</p>
  <p class="ckb__text">Сайт использует cookie и Яндекс Метрику, чтобы работать корректно и понимать, какие страницы полезны гостям. Продолжая пользоваться сайтом, вы соглашаетесь с <a href="/cookie">политикой обработки cookie</a>.</p>
  <button class="ckb__btn" type="button">Понятно</button>
</div>

<script>
(function () {
  var KEY = 'cookie-consent', DAYS = 365;
  var box = document.getElementById('ckb');
  if (!box) return;
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Date.now() - saved.t < DAYS * 864e5) return;   // уже видел баннер
  } catch (e) {}
  box.hidden = false;
  box.querySelector('.ckb__btn').addEventListener('click', function () {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 'ok', t: Date.now() })); } catch (e) {}
    box.hidden = true;
  });
})();
</script>
