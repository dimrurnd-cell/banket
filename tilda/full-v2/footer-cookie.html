<!-- Банкет-Холл: уведомление об использовании cookie. Метрика работает сразу, баннер только сообщает об этом. -->
<style>
.ckb{position:fixed;right:16px;bottom:16px;z-index:9995;width:300px;max-width:calc(100vw - 20px);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 14px;
  background:#fffdf9;color:#666159;border:1px solid #d8d1c5;border-radius:12px;
  box-shadow:0 12px 36px rgba(42,41,38,.2);font-family:Jost,Arial,sans-serif;font-size:12px;line-height:1.4}
.ckb[hidden]{display:none}
.ckb__text{margin:0}
.ckb__text a{color:#a7432c!important;text-decoration:underline!important;text-underline-offset:2px}
.ckb__btn{min-height:32px;padding:0 16px;border-radius:7px;border:0;background:#a7432c;color:#fffdf9;
  font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.ckb__btn:hover{background:#8e3824}
.ckb__btn:focus-visible{outline:2px solid #2a2926;outline-offset:2px}
@media (max-width:640px){
  .ckb{left:10px;right:10px;width:auto;max-width:none;bottom:calc(10px + env(safe-area-inset-bottom));
    flex-direction:row;align-items:center;gap:10px;padding:10px 12px;font-size:11.5px}
  .ckb__btn{flex:none;min-height:34px;padding:0 14px}
}
</style>

<div class="ckb" id="ckb" role="region" aria-label="Уведомление о cookie" hidden>
  <p class="ckb__text">Мы используем cookie и Яндекс Метрику, чтобы сайт работал и мы понимали, что полезно гостям. Продолжая, вы соглашаетесь с <a href="/cookie">политикой cookie</a>.</p>
  <button class="ckb__btn" type="button">Понятно</button>
</div>

<script>
(function () {
  var KEY = 'cookie-consent', DAYS = 365;
  var box = document.getElementById('ckb');
  if (!box) return;
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Date.now() - saved.t < DAYS * 864e5) return;   // уже видел баннер
  } catch (e) {}
  box.hidden = false;
  box.querySelector('.ckb__btn').addEventListener('click', function () {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 'ok', t: Date.now() })); } catch (e) {}
    box.hidden = true;
  });
})();
</script>
