<!-- Банкет-Холл: всплывающее окно «Бронь на новогодние корпоративы». Вставить в блок T123 страницы-подвала. -->
<style>
.nyp{position:fixed;right:16px;bottom:calc(16px + var(--nyp-lift,0px));z-index:9990;width:300px;max-width:calc(100vw - 20px);
  background:#fffdf9;color:#2a2926;border:1px solid #d8d1c5;border-radius:12px;overflow:hidden;
  box-shadow:0 12px 36px rgba(42,41,38,.2);font-family:Jost,Arial,sans-serif;font-size:12.5px;line-height:1.4;
  opacity:0;transform:translateY(12px);visibility:hidden;
  transition:opacity .35s ease,transform .35s ease,bottom .3s ease,visibility 0s linear .35s}
.nyp[hidden]{display:none}
.nyp.is-open{opacity:1;transform:none;visibility:visible;transition:opacity .35s ease,transform .35s ease,bottom .3s ease}
/* Фото встроено в код: не зависит от CDN и не обрезается. */
.nyp__img{display:block;width:100%;height:auto;aspect-ratio:420/245;object-fit:cover;background:#efe8dc}
.nyp__body{padding:10px 14px 12px}
.nyp__badge{position:absolute;top:10px;left:10px;margin:0;padding:2px 8px;border-radius:99px;background:#a7432c;color:#fffdf9;
  font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.nyp__title{margin:0 0 3px;font-size:15px;line-height:1.25;font-weight:500;color:#2a2926}
.nyp__text{margin:0 0 10px;color:#666159}
.nyp__cta{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 16px;border-radius:7px;
  background:#a7432c;color:#fffdf9!important;font-size:13px;font-weight:500;text-decoration:none!important}
.nyp__cta:hover{background:#8e3824}
.nyp__close{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;
  background:rgba(255,253,249,.92);color:#2a2926;font-size:20px;line-height:1;cursor:pointer}
.nyp__close:hover{background:#fffdf9}
.nyp__cta:focus-visible,.nyp__close:focus-visible{outline:2px solid #2a2926;outline-offset:2px}
.nyp__short{display:none}
@media (max-width:640px){
  .nyp{left:10px;right:10px;width:auto;max-width:none;bottom:calc(10px + var(--nyp-lift,0px) + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:88px 1fr;align-items:start;gap:10px;padding:10px 36px 10px 10px}
  .nyp__img{border-radius:6px}
  .nyp__body{padding:0}
  .nyp__badge,.nyp__long{display:none}
  .nyp__short{display:block}
  .nyp__title{font-size:14px;margin-bottom:1px}
  .nyp__text{font-size:12px;margin-bottom:6px}
  .nyp__cta{min-height:32px;padding:0 12px;font-size:12.5px}
  .nyp__close{top:2px;right:2px;width:34px;height:34px;background:transparent;color:#666159}
}
@media (prefers-reduced-motion:reduce){.nyp,.nyp.is-open{transition:none;transform:none}}
</style>

</aside>

<script>
(function () {
  var SHOW_UNTIL = new Date(2026, 11, 26);          // после 25 декабря не показывать
  var DELAY_MS = 2000;                              // через сколько секунд появиться
  var SCROLL_SHARE = 0.35;                          // или когда прокрутили треть страницы
  var HIDE_DAYS = 3;                                // закрыли крестиком — не показывать 3 дня
  var CLICK_DAYS = 30;                              // нажали кнопку — не показывать 30 дней
  var KEY = 'nyp-hidden-until';
  var SKIP = ['/novogodniy-korporativ', '/404'];    // страницы без окна

  var box = document.getElementById('nyp');
  if (!box || new Date() > SHOW_UNTIL) return;
  var path = location.pathname.replace(/\/+$/, '') || '/';
  if (SKIP.indexOf(path) !== -1) return;
  try { if (Date.now() < +localStorage.getItem(KEY)) return; } catch (e) {}

  function remember(days) {
    try { localStorage.setItem(KEY, String(Date.now() + days * 864e5)); } catch (e) {}
  }
  function goal(name) {
    try { if (window.ym) ym(46229070, 'reachGoal', name); } catch (e) {}
  }

  // Пока открыт баннер cookie (#ckb), окно стоит над ним; баннер закрыли — окно опускается вниз.
  var ckb = document.getElementById('ckb');
  function place() {
    var lift = ckb && !ckb.hidden && ckb.offsetHeight ? ckb.offsetHeight + 10 : 0;
    box.style.setProperty('--nyp-lift', lift + 'px');
  }
  if (ckb && window.MutationObserver) new MutationObserver(place).observe(ckb, { attributes: true, attributeFilter: ['hidden'] });
  window.addEventListener('resize', place);

  var shown = false, timer;
  function show() {
    if (shown) return;
    // Пока человек заполняет форму, не мешаем ему.
    var el = document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) { timer = setTimeout(show, 4000); return; }
    shown = true;
    window.removeEventListener('scroll', onScroll);
    place();
    box.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { box.classList.add('is-open'); }); });
    goal('ny_popup_show');
  }
  function hide(days) {
    box.classList.remove('is-open');
    remember(days);
    setTimeout(function () { box.hidden = true; }, 400);
  }
  function onScroll() {
    var max = document.documentElement.scrollHeight - innerHeight;
    if (max > 0 && scrollY / max >= SCROLL_SHARE) show();
  }

  timer = setTimeout(show, DELAY_MS);
  window.addEventListener('scroll', onScroll, { passive: true });

  box.querySelector('.nyp__close').addEventListener('click', function () { hide(HIDE_DAYS); goal('ny_popup_close'); });
  box.querySelector('.nyp__cta').addEventListener('click', function () { remember(CLICK_DAYS); goal('ny_popup_click'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && shown && !box.hidden) hide(HIDE_DAYS); });
  // На телефоне, когда открыта клавиатура, окно прячем, чтобы не закрывало поле ввода.
  document.addEventListener('focusin', function (e) {
    if (shown && !box.hidden && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && innerWidth <= 640) hide(HIDE_DAYS);
  });
})();
</script>
